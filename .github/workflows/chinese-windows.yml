name: MHGU Chinese Windows
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [chinese-ui]
  workflow_dispatch:
    inputs:
      check_only:
        description: "Check stable upstream without building or publishing"
        type: boolean
        default: false
      upstream_tag:
        description: "Optional exact upstream tag; blank builds pinned source"
        type: string
        default: ""
      publish:
        type: boolean
        description: Publish after a successful build
        default: false
permissions:
  contents: write
concurrency:
  group: mhgu-chinese-windows
  cancel-in-progress: false
jobs:
  plan:
    if: github.event_name == 'schedule' || inputs.check_only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sync_tag: ${{ steps.plan.outputs.sync_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check latest stable package
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 custom/auto_update.py
  build:
    needs: plan
    if: always() && !inputs.check_only && (github.event_name != 'schedule' || needs.plan.outputs.build == 'true')
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge selected upstream without publishing untested source
        if: (github.event_name == 'schedule' && needs.plan.outputs.sync_tag != '') || (github.event_name == 'workflow_dispatch' && inputs.upstream_tag != '')
        env:
          UPSTREAM_TAG: ${{ github.event_name == 'schedule' && needs.plan.outputs.sync_tag || inputs.upstream_tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python custom/sync_upstream.py --tag "$env:UPSTREAM_TAG"
      - name: Python build dependencies
        run: python -m pip install fonttools
      - name: Verify translation catalog and download official programs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m unittest discover -s tests -p test_custom_auto_update.py
          python custom/generate_catalog.py --check
          python -m unittest discover -s tests -p test_settings_locale.py
          python -m unittest discover -s tests -p test_custom_gamelib_identity.py
          python custom/stage_release.py fetch
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make git diffutils python
            mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-shaderc mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-vulkan-headers mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-vulkan-memory-allocator
            mingw-w64-ucrt-x86_64-zstd
      - name: Compile host runtime and updater, without game code or game data
        shell: msys2 {0}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("custom/upstream.json"))["custom_version"])')
          python3 custom/align_gamelib.py
          LIBRARY_ID=$(cat out/gamelib-compatible.id)
          make -j4 build/mhgurecomp.exe build/mhgurecomp-updater.exe VERSION="$VERSION" GAMELIB_ID="$LIBRARY_ID"
          make test-settings VERSION="$VERSION" GAMELIB_ID="$LIBRARY_ID"
          make bundle VERSION="$VERSION" GAMELIB_ID="$LIBRARY_ID"
      - name: Package Chinese runtime with matching official program library
        run: python custom/stage_release.py package
      - uses: actions/upload-artifact@v4
        with:
          name: MHGU-Chinese-Windows
          path: dist/*
      - name: Push tested maintenance source
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        run: |
          $metadata = Get-Content custom/upstream.json | ConvertFrom-Json
          git push "https://github.com/$($metadata.custom_repository).git" "HEAD:refs/heads/chinese-ui" "$($metadata.commit):refs/heads/upstream"
          if ($LASTEXITCODE -ne 0) { throw 'Maintenance source push failed; refusing release' }
      - name: Publish tested custom build
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content custom/upstream.json | ConvertFrom-Json).custom_version
          $commit = git rev-parse HEAD
          $releaseArgs = @()
          if ((Get-Content custom/upstream.json | ConvertFrom-Json).prerelease) {
            $releaseArgs += '--prerelease'
          } else {
            $releaseArgs += '--latest'
          }
          gh release create $version dist/* --target $commit --title "MHGU Recomp $version 简体中文" --notes-file custom/RELEASE-NOTES.md @releaseArgs
